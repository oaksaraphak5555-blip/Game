<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💕 2 ปีที่มีเธอ</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

<style>
:root {
  --pink:#ff6b9d;
  --rose:#c9184a;
}

/* sticker */
.sticker-popup{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(0);
  font-size:6rem;
  z-index:99999;
  pointer-events:none;
  opacity:0;
}

.sticker-popup.show{
  animation: pop 1s ease forwards;
}

@keyframes pop{
  0%{transform:translate(-50%,-50%) scale(0);opacity:0;}
  30%{transform:translate(-50%,-50%) scale(1.3);opacity:1;}
  70%{transform:translate(-50%,-50%) scale(1);opacity:1;}
  100%{transform:translate(-50%,-50%) scale(0.8);opacity:0;}
}

.confetti-piece{
  position:fixed;
  top:-20px;
  pointer-events:none;
  z-index:99998;
  animation: fall 2.5s linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}
</style>
</head>

<body>

<button onclick="boom()" style="padding:20px 30px;font-size:20px;">
🎉 กดฉลอง
</button>

<div id="stickerPopup" class="sticker-popup">🥬💖</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  window.boom = function(){

    const sticker = document.getElementById("stickerPopup");

    if(!sticker) return;

    // รี animation ให้ติดทุกครั้ง
    sticker.classList.remove("show");
    void sticker.offsetWidth;
    sticker.classList.add("show");

    // ===== confetti =====
    const emojis = ["💕","🥬","💖","✨","🤍"];
    const colors = ["#ff6b9d","#c77dff","#ffdd44"];

    for(let i=0;i<40;i++){
      setTimeout(()=>{
        const el = document.createElement("div");
        el.className = "confetti-piece";

        el.textContent = Math.random()>0.5
          ? emojis[Math.floor(Math.random()*emojis.length)]
          : "●";

        if(el.textContent==="●"){
          el.style.color = colors[Math.floor(Math.random()*colors.length)];
        }

        el.style.left = Math.random()*100 + "vw";
        el.style.fontSize = (1+Math.random()*1.5) + "rem";

        document.body.appendChild(el);

        setTimeout(()=>el.remove(),3000);
      },Math.random()*500);
    }

    // ===== แตกตัวเล็ก =====
    setTimeout(()=>{
      for(let i=0;i<25;i++){

        const mini = document.createElement("div");
        mini.textContent = emojis[Math.floor(Math.random()*emojis.length)];

        mini.style.position="fixed";
        mini.style.left="50%";
        mini.style.top="50%";
        mini.style.fontSize="2rem";
        mini.style.zIndex="99999";
        mini.style.pointerEvents="none";
        mini.style.transition="1s ease";

        document.body.appendChild(mini);

        const x = (Math.random()-0.5)*500;
        const y = (Math.random()-0.5)*500;

        requestAnimationFrame(()=>{
          mini.style.transform = `translate(${x}px,${y}px) scale(0.2)`;
          mini.style.opacity = "0";
        });

        setTimeout(()=>mini.remove(),1000);
      }
    },400);

  };

});
</script>

</body>
</html>
